# PowerBeam Security Lab - Dia 2
# Politica de rotacion de registros Syslog

/var/log/powerbeam/powerbeam.log {
    daily
    rotate 14
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    su syslog syslog
    create 0640 syslog syslog

    postrotate
        if /usr/bin/systemctl is-active --quiet rsyslog.service; then
            /usr/bin/systemctl kill --signal=HUP --kill-who=main rsyslog.service >/dev/null 2>&1 || true
        fi
    endscript
}
